[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bdp-model-gate"
version = "0.5.3"
description = "Automated pre-deployment ML model governance gate: fairness, performance, compliance, and security checks."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Vangelis Oden" }]
keywords = ["ml", "governance", "fairness", "compliance", "mlops", "responsible-ai", "data-science", "predictive-modelling"]
classifiers = [
    # Keep in step with requires-python and the CI matrix — the PyPI
    # "python versions" badge is generated from these, not from requires-python.
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.23,<3.0",
    "pandas>=1.5,<3.0",
    "joblib>=1.2,<2.0",
]

[project.scripts]
bdp-model-gate = "bdp_model_gate.cli:main"

[project.optional-dependencies]
structured = [
    "scikit-learn>=1.2,<2.0",
    "fairlearn>=0.9,<0.13",
    # Floor is 0.48, not 0.44: shap < 0.47 breaks on import against numpy >= 2
    # ("Converting `np.floating` to a dtype not allowed"), which the numpy
    # range below permits, and it ships no cp313 wheels. Ceiling is 0.50,
    # which raised its own floor to Python 3.11 — above our requires-python.
    "shap>=0.48,<0.50",
]
plots = [
    # seaborn's own requirements are matplotlib, numpy and pandas — no scipy —
    # so given numpy and pandas already ship, this costs a few MB over bare
    # matplotlib. Static SVG rather than plotly or altair: a gate report is an
    # archival record that gets printed, emailed and read years later, and
    # anything needing JavaScript at render time breaks all three.
    "matplotlib>=3.6,<4.0",
    "seaborn>=0.13,<0.15",
]
yaml = [
    "pyyaml>=6.0,<7.0",
]
toml = [
    "tomli>=2.0,<3.0; python_version < '3.11'",
]
dev = [
    "pytest>=7.0,<9.0",
    "pytest-cov>=4.1,<6.0",
    "build>=1.0,<2.0",
    "mypy>=1.8,<2.0",
    "ruff>=0.4,<1.0",
    "pandas-stubs",
    "hypothesis>=6.100,<7.0",
    "matplotlib>=3.6,<4.0",
    "seaborn>=0.13,<0.15",
    "mutmut>=3.0,<4.0",
    "pyyaml>=6.0,<7.0",
    "types-PyYAML>=6.0,<7.0",
]

[project.urls]
Homepage = "https://vanjy-eng.github.io/model-gate/"
Documentation = "https://vanjy-eng.github.io/model-gate/docs/"
Repository = "https://github.com/vanjy-eng/model-gate"
Changelog = "https://github.com/vanjy-eng/model-gate/blob/main/CHANGELOG.md"
Issues = "https://github.com/vanjy-eng/model-gate/issues"
Roadmap = "https://github.com/vanjy-eng/model-gate/blob/main/ROADMAP.md"

[tool.setuptools.packages.find]
include = ["bdp_model_gate*"]

[tool.setuptools.package-data]
bdp_model_gate = ["py.typed"]

[tool.pytest.ini_options]
addopts = "--cov=bdp_model_gate --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]
filterwarnings = [
    # upstream joblib internals reacting to a numpy 2.5 deprecation — not
    # actionable from this codebase, tracked upstream in joblib
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:joblib",
]

[tool.mutmut]
# Mutation testing answers the question this release is about: would the tests
# have noticed? It mutates the source and reports how many mutants the suite
# kills.
#
# The whole package must be copied, not just the files being mutated: mutmut
# runs the tests from inside mutants/, and a partial copy leaves
# `bdp_model_gate` an incomplete package whose imports fall back to the
# installed one. Every mutant then survives, producing a 0% kill rate that
# looks like a catastrophic result but actually means nothing ran.
source_paths = ["bdp_model_gate/"]
also_copy = ["tests/", "pyproject.toml"]

# Mutating these buys little: the CLI is argument plumbing the integration
# tests already cover end to end, the unstructured module is NotImplementedError
# stubs, and logging setup has no behaviour to get wrong.
#
# reporting.py is excluded for a different reason and a weaker one: it is HTML
# assembly, so most mutants are cosmetic string edits, and the properties that
# do matter (self-contained, escaped, degrades) are asserted in
# tests/test_reporting.py, which is not in the fast selection below. Including
# it would sink the score without producing a single actionable survivor.
# The *plots* are mutated, because a chart disagreeing with its own finding is
# exactly the failure this tooling exists to catch.
do_not_mutate = [
    "*/cli.py",
    "*/_logging.py",
    "*/unstructured/*",
    "*/reporting.py",
]

# The full suite is the wrong selection here: the notebook-scale fixtures make
# every mutant slow. These files are fast and assert on values rather than on
# "something was returned", which is what actually kills mutants.
#
# test_plots.py earns its ~1s because it reads values back off the Axes and
# asserts them against the check's own metadata — the one invariant that keeps
# a chart from contradicting the number printed beside it.
pytest_add_cli_args_test_selection = [
    "tests/test_known_answers.py",
    "tests/test_invariants.py",
    "tests/test_properties.py",
    "tests/test_not_applicable.py",
    "tests/test_plots.py",
]
pytest_add_cli_args = ["-x", "-q", "--no-header", "--no-cov", "-p", "no:cacheprovider"]

[tool.coverage.run]
branch = true
source = ["bdp_model_gate"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# FA catches PEP 604 (`X | None`) and PEP 585 syntax used without
# `from __future__ import annotations`. Those annotations are evaluated at
# runtime on Python 3.9, so without the import they are an import-time
# TypeError there while passing cleanly on 3.10+ — invisible locally, and
# it took down the whole 3.9 test job.
select = ["E", "F", "I", "UP", "B", "FA"]
ignore = ["E501"]  # line length handled by formatter, not worth failing CI over

[tool.ruff.format]
# Notebooks keep their hand-tuned layout: the formatter explodes compact
# keyword lists one-per-line, which reads worse in a walkthrough. They are
# still linted by `ruff check`.
exclude = ["examples/*.ipynb"]

[tool.ruff.lint.per-file-ignores]
# These modules call pytest.importorskip before importing an optional
# dependency, so the imports genuinely cannot sit at the top of the file.
"tests/test_properties.py" = ["E402"]
"tests/test_model_matrix.py" = ["E402"]
"tests/test_check_coverage.py" = ["E402"]
"tests/test_cli.py" = ["E402"]
# Tutorial notebooks introduce each import beside the code that uses it, which
# teaches better than a wall of imports in cell 1. Real defects (F, B, UP) are
# still enforced there.
"examples/*.ipynb" = ["E402", "I001"]

[tool.mypy]
# Pinned to 3.12, not requires-python's 3.9: numpy's bundled stubs use PEP 695
# `type` statements, which mypy rejects below 3.12. 3.9 compatibility is
# guarded instead by ruff (target-version = py39) and the 3.9 CI test job.
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = false   # tighten to true once the whole codebase has full annotations
check_untyped_defs = true
ignore_missing_imports = true   # shap/fairlearn/joblib ship no/partial type stubs
