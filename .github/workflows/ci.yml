# CI for the bdp-model-gate library itself: lint, type-check, and test.
#
# This is NOT the pre-deployment model gate — see ci_examples/ for the
# workflows that consumers of this library run against their own models.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        # `[lint]` pins ruff and mypy exactly and the constraints file pins
        # their transitive set, so this job's verdict depends on the code and
        # nothing else. `[structured]` is still needed: mypy follows imports
        # into pandas and numpy.
        run: pip install -e ".[lint,structured]" -c constraints-lint.txt
      - name: Versions
        # Printed so a red run months from now can be compared against a
        # green one without archaeology.
        run: |
          ruff --version
          mypy --version
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy
        run: mypy bdp_model_gate

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Full requires-python range. shap >= 0.48 ships cp313 wheels and
        # imports cleanly against numpy 2.x, so 3.13 is covered too.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev,structured,yaml,toml]"
      - name: Pytest
        run: pytest -q

  test-core-only:
    # The base install has no scikit-learn/fairlearn/shap. Those checks must
    # degrade to NOT_APPLICABLE rather than crash, and metric="auto" must
    # fall back and say so — this job is what proves that stays true.
    name: Test (core install only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install without the structured extra
        run: pip install -e ".[dev,yaml,toml]"
      - name: Remove the plotting stack
        # matplotlib and seaborn are in `dev` on purpose, so a contributor
        # running the suite locally exercises the charts. Here they have to go:
        # this job's whole purpose is to prove the library works without its
        # optional extras, and `plot()` raising a clear GateConfigurationError
        # while the HTML report degrades to text is part of that promise.
        run: pip uninstall -y matplotlib seaborn
      - name: Pytest
        run: pytest -q --no-cov
      - name: The report still renders without charts
        run: |
          python - <<'PY'
          import numpy as np, pandas as pd
          from bdp_model_gate import ModelGate, StructuredGateContext
          from bdp_model_gate.exceptions import GateConfigurationError
          from bdp_model_gate.plots import plotting_available, require_plotting

          assert not plotting_available()
          try:
              require_plotting()
          except GateConfigurationError as exc:
              assert "[plots]" in str(exc), exc
          else:
              raise AssertionError("require_plotting must raise without the extra")

          rng = np.random.default_rng(0)
          X = pd.DataFrame({"a": rng.normal(size=200), "b": rng.normal(size=200)})
          y = (X["a"] > 0).astype(int).to_numpy()
          report = ModelGate().run(
              StructuredGateContext(
                  model=None, X=X, y_true=y, y_pred=y.astype(float),
                  protected_df=pd.DataFrame({"g": rng.choice(["x", "y"], 200)}),
                  predict_fn=lambda frame: np.zeros(len(frame)),
              )
          )
          page = report.to_html()
          assert "<svg" not in page, "charts rendered without matplotlib"
          for r in report.results:
              assert r.check_name in page, r.check_name
          print("text-only report renders every finding")
          PY

  mutation:
    # Still advisory, but for a different reason than before. The score is now
    # a rate over a population that *finishes* — see
    # scripts/mutmut_decision_surface.py — so it is comparable release to
    # release and a floor is safe to set. It stays non-blocking for one
    # release so the first few numbers can be read before one becomes a gate.
    name: Mutation testing (decision surface, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,mutation,structured]"
      - name: Run mutation testing
        # The decision surface is about 1,880 mutants against 12,436 for the
        # whole codebase — roughly eleven minutes at the observed throughput,
        # so the box is now a safety net rather than the thing that decides
        # which mutants get run. `|| true` still only tolerates a timeout; the
        # report step decides whether the run did real work, because an
        # earlier version of this job reported green while importing nothing.
        run: |
          timeout 25m python scripts/mutmut_decision_surface.py run --max-children 4 \
            2>&1 | tee mutation.log || true

      - name: Report
        run: |
          python scripts/mutation_report.py mutation.log --min-tested 200 \
            | tee mutation-report.txt
          {
            echo "### Mutation testing"
            echo '```'
            cat mutation-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-log
          path: |
            mutation.log
            mutation-report.txt
          retention-days: 7

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build backend
        run: pip install build
      - name: Build sdist and wheel
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
